<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#5e8bff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5e8bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#6d5bd0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6d5bd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.72" cy="0.1" r="0.4">
      <stop offset="0" stop-color="#2fd9a6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2fd9a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#8fb3ff"/>
      <stop offset="0.55" stop-color="#5e8bff"/>
      <stop offset="1" stop-color="#8f7be6"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3f63c9"/><stop offset="1" stop-color="#6f9bff"/></linearGradient>
    <linearGradient id="barTeal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1f9e78"/><stop offset="1" stop-color="#41e3b0"/></linearGradient>
    <linearGradient id="barPurple" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5a49b0"/><stop offset="1" stop-color="#9a86f0"/></linearGradient>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#glowA)"/>
  <rect width="1200" height="440" fill="url(#glowB)"/>
  <rect width="1200" height="440" fill="url(#glowC)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" fill="none" stroke="#5e8bff" stroke-opacity="0.14"/>

  <!-- Left: brand + tagline -->
  <g transform="translate(64, 96)">
    <text x="4" y="0" fill="#7f93bd" font-size="15" font-weight="600" letter-spacing="4">AGENTIC · LLM · BENCHMARK</text>
    <text x="0" y="72" fill="url(#word)" font-size="82" font-weight="800" letter-spacing="-1">LLM Compare</text>
    <text x="4" y="120" fill="#c9d4ea" font-size="21" font-weight="500">Race the same agentic coding task across models — each one</text>
    <text x="4" y="150" fill="#c9d4ea" font-size="21" font-weight="500">generates, runs the hidden tests, and is scored <tspan fill="#8fb3ff" font-weight="700">live</tspan>.</text>

    <!-- metric chips -->
    <g transform="translate(4, 196)" font-size="15" font-weight="600">
      <g><circle cx="8" cy="-5" r="6" fill="#41e3b0"/><text x="22" y="0" fill="#aeb9d2">Correctness</text></g>
      <g transform="translate(150,0)"><circle cx="8" cy="-5" r="6" fill="#6f9bff"/><text x="22" y="0" fill="#aeb9d2">Speed</text></g>
      <g transform="translate(258,0)"><circle cx="8" cy="-5" r="6" fill="#9a86f0"/><text x="22" y="0" fill="#aeb9d2">Tokens</text></g>
      <g transform="translate(378,0)"><circle cx="8" cy="-5" r="6" fill="#ffcb5e"/><text x="22" y="0" fill="#aeb9d2">Cost</text></g>
    </g>
  </g>

  <!-- Right: three model columns -->
  <g transform="translate(672, 70)">
    <!-- card template repeated 3x -->
    <g transform="translate(0,0)">
      <rect width="150" height="300" rx="10" fill="#0d1424" fill-opacity="0.72" stroke="#6f9bff" stroke-opacity="0.5"/>
      <rect x="0" y="0" width="150" height="6" rx="3" fill="url(#barBlue)"/>
      <circle cx="18" cy="30" r="7" fill="#6f9bff"/>
      <text x="34" y="35" fill="#e7edfb" font-size="13" font-weight="700">Gemini 3.5</text>
      <rect x="16" y="58" width="118" height="7" rx="3" fill="#31406a"/>
      <rect x="16" y="74" width="86" height="7" rx="3" fill="#31406a"/>
      <rect x="16" y="90" width="104" height="7" rx="3" fill="#31406a"/>
      <rect x="16" y="106" width="64" height="7" rx="3" fill="#31406a"/>
      <text x="16" y="150" fill="#8fa2c6" font-size="10" font-weight="700" letter-spacing="1">METRICS</text>
      <rect x="16"  y="240" width="20" height="34" rx="3" fill="url(#barBlue)"/>
      <rect x="46"  y="214" width="20" height="60" rx="3" fill="url(#barBlue)"/>
      <rect x="76"  y="196" width="20" height="78" rx="3" fill="url(#barBlue)"/>
      <rect x="106" y="222" width="20" height="52" rx="3" fill="url(#barBlue)"/>
      <text x="120" y="150" fill="#41e3b0" font-size="12" font-weight="800" text-anchor="end">100%</text>
    </g>

    <g transform="translate(168,0)">
      <rect width="150" height="300" rx="10" fill="#0d1424" fill-opacity="0.72" stroke="#9a86f0" stroke-opacity="0.5"/>
      <rect x="0" y="0" width="150" height="6" rx="3" fill="url(#barPurple)"/>
      <circle cx="18" cy="30" r="7" fill="#9a86f0"/>
      <text x="34" y="35" fill="#e7edfb" font-size="13" font-weight="700">Claude 4.8</text>
      <rect x="16" y="58" width="118" height="7" rx="3" fill="#3a3566"/>
      <rect x="16" y="74" width="96" height="7" rx="3" fill="#3a3566"/>
      <rect x="16" y="90" width="112" height="7" rx="3" fill="#3a3566"/>
      <rect x="16" y="106" width="72" height="7" rx="3" fill="#3a3566"/>
      <text x="16" y="150" fill="#8fa2c6" font-size="10" font-weight="700" letter-spacing="1">METRICS</text>
      <rect x="16"  y="230" width="20" height="44" rx="3" fill="url(#barPurple)"/>
      <rect x="46"  y="200" width="20" height="74" rx="3" fill="url(#barPurple)"/>
      <rect x="76"  y="210" width="20" height="64" rx="3" fill="url(#barPurple)"/>
      <rect x="106" y="188" width="20" height="86" rx="3" fill="url(#barPurple)"/>
      <text x="120" y="150" fill="#41e3b0" font-size="12" font-weight="800" text-anchor="end">100%</text>
    </g>

    <g transform="translate(336,0)">
      <rect width="150" height="300" rx="10" fill="#0d1424" fill-opacity="0.72" stroke="#41e3b0" stroke-opacity="0.45"/>
      <rect x="0" y="0" width="150" height="6" rx="3" fill="url(#barTeal)"/>
      <circle cx="18" cy="30" r="7" fill="#41e3b0"/>
      <text x="34" y="35" fill="#e7edfb" font-size="13" font-weight="700">Gemini Pro</text>
      <rect x="16" y="58" width="118" height="7" rx="3" fill="#1f4a3f"/>
      <rect x="16" y="74" width="80" height="7" rx="3" fill="#1f4a3f"/>
      <rect x="16" y="90" width="108" height="7" rx="3" fill="#1f4a3f"/>
      <rect x="16" y="106" width="58" height="7" rx="3" fill="#1f4a3f"/>
      <text x="16" y="150" fill="#8fa2c6" font-size="10" font-weight="700" letter-spacing="1">METRICS</text>
      <rect x="16"  y="222" width="20" height="52" rx="3" fill="url(#barTeal)"/>
      <rect x="46"  y="206" width="20" height="68" rx="3" fill="url(#barTeal)"/>
      <rect x="76"  y="190" width="20" height="84" rx="3" fill="url(#barTeal)"/>
      <rect x="106" y="216" width="20" height="58" rx="3" fill="url(#barTeal)"/>
      <text x="120" y="150" fill="#41e3b0" font-size="12" font-weight="800" text-anchor="end">100%</text>
    </g>
  </g>
</svg>
