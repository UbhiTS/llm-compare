          turntableEnabled,
          spin3AxisEnabled,
          cameraPreset: currentCameraPreset,
          spinEpochMs: spinSyncEpochMs,
          angles: { x: anglesOut.x, y: anglesOut.y, z: anglesOut.z },
          modelRotation: modelRoot ? { x: modelRoot.rotation.x, y: modelRoot.rotation.y, z: modelRoot.rotation.z } : null,
        });
      } else if (msg.type === 'CAD_CAPTURE_FOUR_VIEW' || msg.type === 'CAD_REQUEST_4VIEW') {
        const dataUrl = captureFourAngleCompositeDataUrl();
        postToParent({
          type: 'CAD_FOUR_VIEW_READY',
          slot: slotId,
          reqId: msg.reqId || '',
          fourViewDataUrl: dataUrl,
          dataUrl,
          telemetry: latestTelemetry,
        });
        postToParent({
          type: 'CAD_4VIEW_SNAPSHOT',
          slot: slotId,
          dataUrl,
          fourViewDataUrl: dataUrl,
          telemetry: latestTelemetry,
        });
      } else if (msg.type === 'CAD_EXPORT_STEP_TEXT') {
        const reqId = msg.reqId || '';
        exportStepAsync({ productName: `${safeSlug()}_AP214` })
          .then(({ stepText, warnings }) => {
            postToParent({
              type: 'CAD_STEP_TEXT_READY',
              slot: slotId,
              reqId,
              stepText,
              warnings,
            });
          })
          .catch((err) => {
            postToParent({
              type: 'CAD_STEP_TEXT_READY',
              slot: slotId,
              reqId,
              stepText: '',
              warnings: [`STEP export failed: ${String(err && err.message ? err.message : err)}`],
            });
          });
      }
    });

    window.addEventListener('resize', () => {
      const w = Math.max(1, window.innerWidth);
      const h = Math.max(1, window.innerHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // Render loop. A render-time exception (e.g. a material the script left half-configured)
    // used to kill the loop silently and freeze the viewport; now it is reported once to the
    // parent and the loop keeps running so the next successful rebuild recovers. Rendering is
    // skipped while the tab is hidden so 4-6 slots do not burn GPU time in the background.
    let renderErrorReported = false;
    function animate(nowMs) {
      requestAnimationFrame(animate);
      if (document.visibilityState !== 'visible') return;
      try {
        const now = typeof nowMs === 'number' ? nowMs : performance.now();
        const dt = Math.min(0.1, Math.max(0, (now - lastAnimFrameMs) / 1000));
        lastAnimFrameMs = now;
        if (spin3AxisEnabled && modelRoot) {
          if (cameraSyncEnabled) {
            const synced = computeSyncedSpin3AxisAngles(Date.now());
            applySpin3AxisTransform(synced.x, synced.y, synced.z);
          } else {
            const nx = (spin3AxisAngles.x + dt * 0.65) % (Math.PI * 2);
            const ny = (spin3AxisAngles.y + dt * 1.05) % (Math.PI * 2);
            const nz = (spin3AxisAngles.z + dt * 0.42) % (Math.PI * 2);
            applySpin3AxisTransform(nx, ny, nz);
          }
        } else if (turntableEnabled && modelRoot) {
          if (cameraSyncEnabled) {
            const ry = computeSyncedTurntableAngle(Date.now());
            applySpin3AxisTransform(0, ry, 0);
          } else {
            const ny = (spin3AxisAngles.y + dt * 0.85) % (Math.PI * 2);
            applySpin3AxisTransform(0, ny, 0);
          }
        }
        controls.update();
        renderer.render(scene, camera);
      } catch (err) {
        if (renderErrorReported) return;
        renderErrorReported = true;
        const msg = describeError(err);
        showBanner(`3D render loop error:\n${msg}`);
        updateTelemetryBarUI(null, msg);
        postToParent({
          type: 'CAD_ERROR',
          slot: slotId,
          phase: 'render',
          error: msg,
        });
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        lastAnimFrameMs = performance.now();
        const w = Math.max(1, window.innerWidth);
        const h = Math.max(1, window.innerHeight);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        if (modelRoot) {
          if (cameraSyncEnabled) {
            if (spin3AxisEnabled) {
              const synced = computeSyncedSpin3AxisAngles(Date.now());
              applySpin3AxisTransform(synced.x, synced.y, synced.z);
            } else if (turntableEnabled) {
              const ry = computeSyncedTurntableAngle(Date.now());
              applySpin3AxisTransform(0, ry, 0);
            }
          }
          applyRenderModeToModel();
          renderer.render(scene, camera);
        }
      }
    });
    animate();

    // Notify parent that CAD viewport iframe is ready
    postToParent({ type: 'CAD_VIEWPORT_READY', slot: slotId });
  </script>
</body>
</html>
